stream {
    map $ssl_preread_server_name $kioosk_https_backend {
        kioosk.space 127.0.0.1:8443;
        default 127.0.0.1:10443;
    }
    server {
        listen 443;
        listen [::]:443;
        ssl_preread on;
        proxy_protocol on;
        proxy_pass $kioosk_https_backend;
        proxy_timeout 10m;
    }
}
