server {
    listen 80;
    server_name kioosk.space;
    location ^~ /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://kioosk.space$request_uri; }
}
server {
    listen 127.0.0.1:8443 ssl proxy_protocol;
    client_max_body_size 9m;
    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;
    server_name kioosk.space;
    ssl_certificate /etc/letsencrypt/live/kioosk.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kioosk.space/privkey.pem;
    root /srv/kioosk/current/public;
    index index.php;
    location = /hooks/github {
        client_max_body_size 1m;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /srv/kioosk/current/ops/github-webhook.php;
        fastcgi_pass unix:/run/php/php-fpm.sock;
    }
    location / { try_files $uri $uri/ /index.php?$query_string; }
    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param HTTPS on;
        fastcgi_param PHP_VALUE "upload_max_filesize=8M\npost_max_size=9M";
        fastcgi_pass unix:/run/php/php-fpm.sock;
    }
    location ~ \.php$ { return 404; }
    location ~ /\. { deny all; }
}
